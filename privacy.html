<style>
@font-face { font-family: "Fraunces Mj"; src: url(f/Fraunces-BlackSoft.woff2) format("woff2"); font-weight: 700 900; font-display: swap; }
@font-face { font-family: "Nunito Mj"; src: url(f/Nunito-SemiBold.woff2) format("woff2"); font-weight: 400 700; font-display: swap; }
@font-face { font-family: "Nunito Mj"; src: url(f/Nunito-ExtraBold.woff2) format("woff2"); font-weight: 800 900; font-display: swap; }
:root {
  /* Mahjoria: a descent from orbit to the ground. Deep space green, ivory tiles, one blue hologram, Majold gold. */
  --night: #06150f;
  --canopy: #10331f;
  --moss: #1c4a2f;
  --ivory: #fae8ca;
  --gold: #f3cf9a;
  --holo: #8ae6ff;
  --ink-soft: rgba(250, 232, 202, 0.74);
  --display: "Fraunces Mj", "Georgia", serif;
  --body: "Nunito Mj", "Segoe UI", system-ui, sans-serif;
  --step--1: 0.9rem;
  --step-0: 1.08rem;
  --step-1: 1.35rem;
  --step-2: 1.9rem;
  --step-3: clamp(2.2rem, 5vw, 3.3rem);
  --gutter: clamp(18px, 5vw, 56px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--night); }
body {
  margin: 0;
  background: var(--night);
  color: var(--ivory);
  font-family: var(--body);
  font-weight: 600;
  font-size: var(--step-0);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: var(--gold); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--holo); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 {
  font-family: var(--display);
  font-weight: 900;
  line-height: 1.08;
  margin: 0;
  text-wrap: balance;
  color: var(--gold);
}
h2 { font-size: var(--step-3); }
p { margin: 0; max-width: 34em; }

/* ---------- top bar ---------- */
.bar {
  position: absolute; inset: 0 0 auto 0; z-index: 5;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px var(--gutter);
}
.bar .studio { font-size: var(--step--1); color: var(--ink-soft); text-decoration: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.lang select {
  font: 800 var(--step--1)/1 var(--body); color: var(--ivory); background: rgba(0,0,0,.4);
  border: 1.5px solid rgba(243,207,154,.45); border-radius: 999px; padding: 9px 34px 9px 14px; cursor: pointer;
  appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--gold) 50%), linear-gradient(135deg, var(--gold) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat;
}
.lang select:focus-visible { outline: 3px solid var(--holo); outline-offset: 2px; }
.lang option { color: #10331f; background: #fae8ca; }

/* ---------- altitude rail (the page descends like the game zooms) ---------- */
.rail {
  position: fixed; left: 14px; top: 50%; transform: translateY(-50%); z-index: 4;
  display: none; flex-direction: column; gap: 22px;
  font-size: 0.78rem; color: rgba(250,232,202,.45);
}
.rail { direction: ltr; }
.rail span { display: flex; align-items: center; gap: 8px; transition: color .3s; }
.rail span::before { content: ""; width: 7px; height: 7px; border-radius: 2px; border: 1.5px solid currentColor; }
.rail span.on { color: var(--holo); }
.rail span.on::before { background: var(--holo); }
@media (min-width: 1100px) { .rail { display: flex; } }

/* ---------- orbit: hero ---------- */
.orbit {
  position: relative; overflow: hidden;
  padding: 120px var(--gutter) 90px;
  background: radial-gradient(120% 80% at 50% 100%, var(--canopy) 0%, var(--night) 62%);
  text-align: center;
}
#stars { position: absolute; inset: 0; width: 100%; height: 100%; }
.holo {
  position: relative; width: min(440px, 78vw); margin: 0 auto;
  filter: drop-shadow(0 0 18px rgba(80, 200, 255, .55));
}
.holo img { filter: grayscale(1) brightness(1.6) sepia(1) hue-rotate(160deg) saturate(3.2); opacity: .92; }
.holo::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(6,21,15,.35) 0 2px, transparent 2px 5px);
  mix-blend-mode: multiply; pointer-events: none;
  -webkit-mask: url(a/wordmark.webp) center / contain no-repeat; mask: url(a/wordmark.webp) center / contain no-repeat;
}
.beam {
  width: 2px; height: 70px; margin: 6px auto 0;
  background: linear-gradient(var(--holo), rgba(138,230,255,0));
  box-shadow: 0 0 10px var(--holo);
}
.planet {
  position: relative; width: min(380px, 70vw); aspect-ratio: 1; margin: -6px auto 0;
  border-radius: 50%;
}
.planet .ring {
  position: absolute; inset: -14px; border-radius: 50%;
  border: 1.5px dashed rgba(138,230,255,.45);
}
.planet img {
  width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
  box-shadow: 0 0 80px rgba(110,190,255,.28);
}
.orbit .lede { margin: 34px auto 0; font-size: var(--step-1); color: var(--ivory); max-width: 26em; }
.stores { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 18px; margin-top: 26px; }
.store { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.store img { height: 50px; width: auto; }
.store small { font-size: 0.78rem; color: var(--ink-soft); }

/* ---------- surface: playable parcel ---------- */
.surface {
  padding: 96px var(--gutter);
  background: var(--canopy);
  display: grid; gap: 40px; align-items: center;
  grid-template-columns: 1fr;
}
@media (min-width: 900px) { .surface { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); } }
.surface .copy { display: grid; gap: 18px; }
.meter {
  direction: ltr; justify-content: flex-start;
  display: flex; align-items: baseline; gap: 10px; margin-top: 8px;
  font-family: var(--display); font-weight: 900;
}
.meter b { font-size: 3.4rem; color: var(--ivory); font-variant-numeric: tabular-nums; line-height: 1; }
.meter span { color: var(--gold); font-size: var(--step-1); }
.again {
  justify-self: start; font: 800 var(--step-0)/1 var(--body);
  color: var(--canopy); background: var(--ivory); border: 0; border-radius: 14px;
  padding: 14px 22px; cursor: pointer; box-shadow: 0 5px 0 #b98d55;
}
.again:active { transform: translateY(3px); box-shadow: 0 2px 0 #b98d55; }
.board {
  position: relative; border-radius: 22px; overflow: hidden;
  background: url(a/forest.webp) center / cover;
  aspect-ratio: 6 / 5; max-width: 620px; width: 100%; justify-self: center;
  box-shadow: 0 30px 60px rgba(0,0,0,.45), 0 0 0 2px rgba(243,207,154,.35);
}
.grid {
  position: absolute; inset: 5%;
  display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 2.4%;
}
.tile {
  border: 0; padding: 0; background: none; cursor: pointer;
  transition: transform .18s ease, filter .18s ease, opacity .35s ease;
  filter: drop-shadow(0 6px 4px rgba(0,0,0,.45));
}
.tile img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.tile.picked { transform: translateY(-9%) scale(1.06); filter: drop-shadow(0 14px 8px rgba(0,0,0,.5)) brightness(1.06); }
.tile.gone { opacity: 0; transform: scale(.4) rotate(12deg); pointer-events: none; }
.tile.nope { animation: nope .3s; }
@keyframes nope { 25% { transform: translateX(-6%); } 75% { transform: translateX(6%); } }
.done {
  position: absolute; inset: auto 5% 5% 5%; padding: 16px 20px; border-radius: 16px;
  background: rgba(6,21,15,.82); color: var(--ivory); font-size: var(--step-0);
  opacity: 0; transform: translateY(10px); transition: .4s; pointer-events: none;
}
.done.show { opacity: 1; transform: none; }

/* ---------- the world, three zoom levels ---------- */
.world { padding: 100px var(--gutter) 40px; background: linear-gradient(var(--night), var(--canopy) 40%); }
.world .head { display: grid; gap: 16px; margin-bottom: 44px; }
.zoom { display: grid; gap: 28px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .zoom { grid-template-columns: 1.15fr 1fr; align-items: center; } }
.phone {
  width: min(300px, 70vw); justify-self: center;
  border-radius: 34px; padding: 10px; background: #0a1a12;
  box-shadow: 0 0 0 2px rgba(243,207,154,.4), 0 30px 60px rgba(0,0,0,.5);
}
.phone img { border-radius: 26px; }
.levels { list-style: none; margin: 0; padding: 0; display: grid; gap: 26px; }
.levels li { display: grid; grid-template-columns: 92px 1fr; gap: 16px; align-items: start; }
.alt {
  direction: ltr; unicode-bidi: isolate;
  font-family: var(--display); font-weight: 800;
  color: var(--holo); font-size: var(--step-1); line-height: 1.2; font-variant-numeric: tabular-nums;
}
.levels h3 { font-size: var(--step-1); margin-bottom: 4px; }
.levels p { color: var(--ink-soft); }

/* ---------- Majold ---------- */
.majold {
  padding: 100px var(--gutter);
  background: radial-gradient(60% 70% at 25% 50%, rgba(243,207,154,.10), transparent 70%), var(--night);
  display: grid; gap: 36px; align-items: center; grid-template-columns: 1fr;
}
@media (min-width: 820px) { .majold { grid-template-columns: 320px 1fr; } }
.majold img { width: min(300px, 70vw); justify-self: center; }
.majold .copy { display: grid; gap: 16px; }
.promise {
  margin-top: 6px; padding: 18px 22px; border-radius: 16px;
  border: 1.5px solid rgba(63,217,139,.5); background: rgba(63,217,139,.07);
  color: var(--ivory); max-width: 34em;
}

/* ---------- languages ---------- */
.hello { padding: 90px var(--gutter) 70px; background: var(--night); }
.hello h2 { margin-bottom: 28px; }
.words { display: flex; flex-wrap: wrap; gap: 10px; }
.words span {
  font-family: var(--display); font-weight: 800;
  font-size: 1.15rem; color: var(--canopy); background: var(--ivory);
  padding: 10px 16px 12px; border-radius: 12px; box-shadow: 0 5px 0 #c9a56f;
}
.words span:nth-child(3n) { background: #f4dcae; }

/* ---------- footer + text pages ---------- */
footer {
  padding: 44px var(--gutter) 60px; background: #040e0a; color: var(--ink-soft);
  display: flex; flex-wrap: wrap; gap: 18px 34px; align-items: center; justify-content: space-between;
  font-size: var(--step--1);
}
footer nav { display: flex; gap: 22px; flex-wrap: wrap; }
footer a { color: var(--ink-soft); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<script>
const T = {"en": {"lede": "A whole planet lies under mahjong tiles. Match pairs, clear each parcel and watch the land rise underneath.", "soon": "Coming soon", "tryH": "Clear a parcel right here", "tryP": "Tap two tiles with the same symbol. Each pair you match opens the ground below. In the game, every parcel you finish adds 108 m² to your world.", "m2": "m² opened", "again": "Lay new tiles", "done": "Parcel cleared. The planet has millions more waiting under the tiles.", "worldH": "One planet, seen from three heights", "worldP": "Pinch out and the parcel you are playing becomes part of a tiled landscape, then a globe in space. Everything you open stays open.", "l1h": "The globe", "l1p": "Your opened land shows up as green on a planet still covered in ivory tiles.", "l2h": "The landscape", "l2p": "Stack heights follow the land beneath, so you can guess where hills and lakes will appear.", "l3h": "Your parcel", "l3p": "Big, clear tiles sized for a phone screen. Finish one and the ground rises, sometimes with a discovery.", "mjH": "Majold, the coin of the planet", "mjP": "You earn Majold by clearing parcels, collecting stars and coming back each day. Spend it on hints and shuffles when a parcel gets tricky.", "mjPromise": "No ads between turns. An ad plays only when you choose to watch one for Majold.", "helloH": "Playable in 21 languages", "privL": "Privacy", "termsL": "Terms of use", "privH": "Your privacy", "termsH": "Terms of Use", "back": "Back to Mahjoria", "privT": "Mahjoria has no accounts and no sign-up.\n\n• Your progress is stored only on this device; we have no server and collect no personal data from you.\n• Ads play only when you choose (\"Watch an ad\"). Ads are served by Google AdMob, which may use information such as your device's advertising ID and approximate location to show and measure ads. In Europe you are asked for consent at launch; you can change your choice in Settings under \"Ad privacy\".\n• Deleting the app deletes all your game data. You can reset your progress at any time with \"Start over\" in Settings.\n• How Google uses data: policies.google.com/technologies/partner-sites", "termsT": "These terms govern your use of the Mahjoria game, the mahjoria.com website and related services. By downloading and playing the game you accept these terms, the Privacy notice and the \"Rules & fair play\" page. Last updated: 17 November 2026.\n\n1. Parties\nMahjoria is published by Swiff Studio (contact: info@swiff.com.tr). You download the app from the Apple App Store or Google Play; these stores are not parties to these terms and are not responsible for supporting the game.\n\n2. Licence to play\nWe give you a personal, non-transferable, non-exclusive and revocable licence to use Mahjoria for personal, non-commercial entertainment. You may not copy, modify, sell or reuse in another product the game's code, artwork, sounds, the Mahjoria name or logo. All rights in them belong to Swiff Studio.\n\n3. For entertainment only\nMahjoria is a skill and puzzle game. It contains no real-money gambling, betting or games of chance, and no real money or real-world prizes can be won. All rewards in the game are in-game digital items.\n\n4. Majold and in-game items\n• Majold, hints, shuffles and similar items are licensed to you for use in the game; they are not your property and have no value outside the game. They cannot be exchanged for money, sold or transferred to another person or device.\n• The approximate euro value of every item priced in Majold is shown next to the price. Pack contents are fixed; the game has no random reward boxes or purchases based on chance.\n• Purchases are made through Apple or Google; there are no subscriptions. Refund requests are handled under the store's rules. Your statutory withdrawal and refund rights are not affected.\n• We do not take back Majold or items you earned or bought, except in cases of cheating or a technical error (e.g. a reward given by mistake).\n\n5. How your progress is stored\nMahjoria has no accounts; your progress, Majold and purchased items are stored only on your device. If you delete the app, reset or lose your device, this data is lost and we have no way to restore it. One-time packs you bought can be restored to the extent the store offers \"restore purchases\".\n\n6. Fair play\nCheat software, auto-players, modifying game files or saves, manipulating the device clock, knowingly exploiting bugs and using the game to harm others are not allowed. In such cases scores and unfairly gained items may be removed and access to leaderboards may be blocked. Details are on the \"Rules & fair play\" page.\n\n7. Ads\nThe game only shows rewarded ads that you choose to open (\"Watch ad\"); there are no forced ads between play. Ads are served by Google AdMob; advertisers are responsible for ad content.\n\n8. Children and parents\nMahjoria is suitable for everyone. Players under 18 should ask a parent before making purchases. Parents can use Apple's and Google's controls such as purchase approval and spending limits. For a purchase made by a child without permission, you can use the store's refund process.\n\n9. Changes to the game and end of service\nWe may update content, prices, rewards and rules to improve the game. We will not use such changes to make items you already bought worthless. If we decide to shut Mahjoria down completely, we will announce it in the game and on the website at least 60 days in advance; during that time new Majold sales stop and you can use the Majold you have.\n\n10. Liability\nMahjoria is provided as is. We make reasonable efforts for it to work without interruption or errors, but we cannot guarantee it will work perfectly on every device in every situation. To the extent permitted by applicable law, we are not responsible for problems caused by devices, connections, stores or third parties that are not our fault, or for indirect damage resulting from them. Our liability for intent and gross negligence, and your statutory consumer rights, are not limited in any way.\n\n11. Governing law and disputes\nThese terms are governed by the laws of the Republic of Türkiye. If you are a consumer, the mandatory protections of your country of residence also apply and you keep the right to go to the consumer bodies or courts of your own country. We kindly ask you to write to info@swiff.com.tr first; most issues can be solved quickly.\n\n12. Changes, severability, contact\nWe may update these terms; the current date is shown on this page and important changes are announced in the game. If one section is found invalid, the others remain in force. Questions: info@swiff.com.tr", "rulesH": "Rules & fair play", "rulesL": "Rules", "rulesT": "This page explains how scores, leaderboards and prizes work in Mahjoria. The \"Rules & fair play\" screen in the game is a summary of this page; if they differ, this page applies. Last updated: 17 November 2026.\n\nNote: the weekly leaderboard, Player of the month and prizes are not live in the game yet. They will be announced in the game when they open, and these rules apply from that date; until then these sections are not a promise of any prize.\n\n1. Organiser\nMahjoria and its leaderboards and prizes are run by Swiff Studio (contact: info@swiff.com.tr). Apple and Google are not sponsors of these leaderboards or prizes and are not involved with them in any way.\n\n2. Taking part is free\nNo purchase is needed to take part. Buying anything, watching ads or spending Majold does not improve your chances: points are earned only by playing.\nLeaderboards are not run on a server of ours but by Apple Game Center on iPhone and iPad and by Google Play Games on Android. To take part you sign in to that service with your own Apple or Google account; the leaderboard shows your nickname there and your score. Apple and Google process this under their own privacy policies; Swiff Studio does not collect or store any personal data about you. If you do not sign in, you play exactly the same, you just do not appear on leaderboards and receive no leaderboard prizes.\n\n3. How points are calculated\n• Every tile you remove in a parcel you finish is worth 10 points. The parcel's stars multiply this: 1 star ×0.9 · 2 stars ×1.0 · 3 stars ×1.1.\n• Quick matching chains (combos) give bonus points: from the 3rd match on, the position in the chain ×10 points; +100, +250 and +500 at the 6th, 9th and 12th match; after the 12th, +500 every 3 matches.\n• Land opened (m²) is not a score; it is shown for information only. Clearing many easy parcels with few tiles therefore does not put a player ahead of someone clearing hard parcels with many tiles.\n• Hints, shuffles and Majold that are bought, earned from ads or received as gifts give no points. World Tour, Hidden Area and event boards give Majold, not leaderboard points.\n• There are no hidden multipliers, no player-specific advantages and no extra points unlocked at higher levels. The rules are the same for everyone.\n\n4. Weekly leaderboard\n• Only points earned that week count on the weekly leaderboard. Apple's and Google's leaderboards are separate: iPhone/iPad players are ranked among themselves and Android players among themselves.\n• On Apple Game Center the week runs from Monday 00:00 UTC to Sunday 23:59 UTC. On Google Play Games the week is set by Google: it resets at midnight between Saturday and Sunday, US Pacific time (UTC-7).\n• On equal points, the ranking is decided by the respective service.\n\n5. Player of the month\nThe player with the highest total score over the calendar month (UTC) becomes \"Player of the month\", separately on each platform.\n\n6. Prizes\n• Weekly, on each platform: 1st 300 Majold + badge · 2nd 150 Majold · 3rd 75 Majold. In addition everyone finishing the week in the top 1% gets 50, top 10% 25 and top 25% 10 Majold. Tier prizes do not stack; the highest applies.\n• Player of the month: a tile theme made for that month + badge.\n• The prize is added the first time you open the game after the week or month ends. Your position is the result reported by Apple or Google. Because Google Play Games does not provide past weeks' results, on Android your position is the last one read when you open the game during the final 24 hours of the week; if you did not open the game that day, no prize can be given for that week.\n• Prizes are in-game digital items only. They have no cash value and cannot be exchanged for money, sold, transferred or traded. No cash or other alternative can be requested instead.\n• Prize amounts and types may change if announced before a week or month starts; they never change for a week or month already under way.\n\n7. Majold\n• Majold is the virtual currency used in Mahjoria for items such as hints and shuffles. It is earned by playing, from the daily gift, from rewarded ads, or by purchase.\n• Majold has no value outside Mahjoria and cannot be exchanged for money or moved to another account.\n• The approximate euro value of every item priced in Majold is shown next to the price in the game (100 Majold ≈ €0.99). Pack contents are fixed; Mahjoria has no random reward boxes, wheels or purchases based on chance.\n• Purchases are made through the Apple App Store or Google Play; payment, refunds and parental approval follow those stores' rules. Your statutory withdrawal and refund rights are not affected.\n• Majold and items you earned or bought are never taken back, except in cases of cheating or a technical error (e.g. a prize given twice by mistake).\n\n8. Fair play\n• Cheat software, auto-players, modifying game files or saves, manipulating the device clock, knowingly exploiting bugs and collecting prizes with several accounts are not allowed.\n• Unusual scores are reviewed. If the rules were broken, scores may be removed, the player may be excluded from leaderboards and prizes gained unfairly may be taken back.\n• You can appeal a decision within 14 days by writing to info@swiff.com.tr; appeals are answered within 30 days at the latest.\n• Inappropriate nicknames are changed.\n\n9. Children\nMahjoria is suitable for everyone. Leaderboards only show your Apple or Google nickname. Players under 18 need a parent's permission to make purchases; Apple's and Google's parental controls (purchase approval) can be used.\n\n10. Interruptions and liability\nMahjoria is provided as is. We make reasonable efforts to keep leaderboards and prizes working correctly during connection, server, device or store interruptions. To the extent permitted by applicable law, we are not responsible for points or rankings lost because of such interruptions that are not our fault. This section does not limit any consumer rights you have by law.\n\n11. Changes and contact\nWe may update these rules; the date of the change is shown on this page and changes never affect a week or month already under way. Leaderboards are subject to these rules from the date they open in the game. Questions and appeals: info@swiff.com.tr"}, "tr": {"lede": "Koca bir gezegen mahjong taşlarının altında. Eşleri bul, her parseli temizle, altından toprağın yükselişini izle.", "soon": "Çok yakında", "tryH": "Bir parseli burada aç", "tryP": "Aynı simgeli iki taşa dokun. Eşleştirdiğin her çift alttaki toprağı açar. Oyunda bitirdiğin her parsel dünyana 108 m² ekler.", "m2": "m² açıldı", "again": "Yeni taş diz", "done": "Parsel açıldı. Gezegende taşların altında bekleyen milyonlarcası var.", "worldH": "Tek gezegen, üç yükseklikten", "worldP": "İki parmakla uzaklaş: oynadığın parsel önce taşlı bir manzaranın, sonra uzaydaki bir kürenin parçası olur. Açtığın her yer açık kalır.", "l1h": "Küre", "l1p": "Açtığın topraklar, hâlâ fildişi taşlarla kaplı gezegende yeşil görünür.", "l2h": "Manzara", "l2p": "Taş yığınlarının yüksekliği alttaki araziyi izler; tepelerin ve göllerin nerede çıkacağını tahmin edebilirsin.", "l3h": "Parselin", "l3p": "Telefon ekranına göre büyük, net taşlar. Bitirdiğinde zemin yükselir, bazen bir keşif çıkar.", "mjH": "Majold, gezegenin parası", "mjP": "Majold'u parsel temizleyerek, yıldız toplayarak ve her gün uğrayarak kazanırsın. Parsel zorlaşınca ipucu ve karıştırma için harcarsın.", "mjPromise": "Oyun aralarında reklam yok. Reklam yalnızca Majold için sen izlemek istersen oynar.", "helloH": "21 dilde oynanır", "privL": "Gizlilik", "termsL": "Kullanım koşulları", "privH": "Gizliliğin", "termsH": "Kullanım Koşulları", "back": "Mahjoria'ya dön", "privT": "Mahjoria'da hesap yok, kayıt yok.\n\n• İlerlemen yalnızca bu cihazda saklanır; bizim bir sunucumuz yok ve senden kişisel veri toplamıyoruz.\n• Reklam yalnızca sen istersen oynar (\"Reklam izle\"). Reklamları Google AdMob gösterir; AdMob reklamı göstermek ve ölçmek için cihazın reklam kimliği ve yaklaşık konum gibi bilgileri kullanabilir. Avrupa'da açılışta iznin sorulur; kararını Ayarlar'daki \"Reklam izinleri\"nden değiştirebilirsin.\n• Uygulamayı sildiğinde bütün oyun verilerin de silinir. Ayarlar'daki \"Baştan başla\" ile ilerlemeni istediğin an sıfırlayabilirsin.\n• Google'ın verileri nasıl kullandığı: policies.google.com/technologies/partner-sites", "termsT": "Bu koşullar Mahjoria oyununu, mahjoria.com sitesini ve ilgili hizmetleri kullanımını düzenler. Oyunu indirip oynayarak bu koşulları, Gizlilik metnini ve \"Kurallar ve Adil Oyun\" sayfasını kabul etmiş olursun. Son güncelleme: 17 Kasım 2026.\n\n1. Taraflar\nMahjoria'yı Swiff Studio yayımlar (iletişim: info@swiff.com.tr). Uygulamayı Apple App Store ya da Google Play üzerinden indirirsin; bu mağazalar bu koşulların tarafı değildir ve oyunla ilgili destekten sorumlu değildir.\n\n2. Oynama izni\nSana Mahjoria'yı kişisel, ticari olmayan eğlence amacıyla kullanman için kişisel, devredilemez, münhasır olmayan ve geri alınabilir bir izin veriyoruz. Oyunun kodunu, görsellerini, seslerini, Mahjoria adını ve logosunu kopyalayamaz, değiştiremez, satamaz ya da başka bir üründe kullanamazsın. Bunların tüm hakları Swiff Studio'ya aittir.\n\n3. Oyun yalnızca eğlence içindir\nMahjoria bir beceri ve bulmaca oyunudur. Gerçek parayla kumar, bahis ya da şans oyunu içermez; oyunda gerçek para ya da gerçek ödül kazanılmaz. Oyundaki tüm ödüller oyun içi dijital öğelerdir.\n\n4. Majold ve oyun içi öğeler\n• Majold, ipucu, karıştırma ve benzeri öğeler için sana kullanma izni verilir; bunlar senin mülkün değildir ve oyun dışında değerleri yoktur. Paraya çevrilemez, satılamaz, başka bir kişiye ya da cihaza devredilemez.\n• Majold ile alınan her öğenin yaklaşık avro karşılığı fiyatın yanında gösterilir. Paket içerikleri sabittir; oyunda rastgele ödül kutusu ya da şansa dayalı satın alma yoktur.\n• Satın almalar Apple ya da Google üzerinden yapılır; ödeme, iade, abonelik yoktur. İade talepleri mağazanın kurallarına göre değerlendirilir. Kanunla tanınan cayma ve iade hakların saklıdır.\n• Kazandığın ya da satın aldığın Majold ve öğeleri, hile ya da teknik hata (ör. yanlışlıkla verilen ödül) dışında senden geri almayız.\n\n5. İlerlemenin saklanması\nMahjoria'da hesap yoktur; ilerlemen, Majold'un ve satın aldığın öğeler yalnızca cihazında saklanır. Uygulamayı silersen, cihazı sıfırlarsan ya da cihazını kaybedersen bu veriler kaybolur ve bizim onları geri getirme imkânımız yoktur. Satın aldığın tek seferlik paketleri mağazanın \"satın alımları geri yükle\" imkânı sunduğu ölçüde geri yükleyebilirsin.\n\n6. Adil oyun\nHile yazılımı, otomatik oynatıcı, oyun dosyalarını ya da kayıtları değiştirmek, cihaz saatiyle oynamak, hataları bilerek kullanmak ve oyunu başkasının zararına kullanmak yasaktır. Bu durumda puanlar ve haksız kazanılan öğeler silinebilir, sıralamalara katılım engellenebilir. Ayrıntılar \"Kurallar ve Adil Oyun\" sayfasındadır.\n\n7. Reklamlar\nOyunda yalnızca senin istediğinde açılan ödüllü reklamlar vardır (\"Reklam izle\"); oyun aralarında zorunlu reklam yoktur. Reklamları Google AdMob gösterir; reklam içeriğinden reklam veren sorumludur.\n\n8. Çocuklar ve ebeveynler\nMahjoria herkese uygundur. 18 yaşından küçükler satın alma yapmadan önce ebeveyninden izin almalıdır. Ebeveynler Apple ve Google'ın satın alma onayı ve harcama sınırı gibi denetimlerini kullanabilir. Çocuğun izinsiz yaptığı bir satın alma için mağazanın iade sürecine başvurabilirsin.\n\n9. Oyundaki değişiklikler ve oyunun sona ermesi\nOyunu daha iyi hale getirmek için içerik, fiyat, ödül ve kuralları güncelleyebiliriz. Satın almış olduğun öğeleri bu değişikliklerle değersiz hale getirmeyiz. Mahjoria'yı tamamen kapatmaya karar verirsek bunu en az 60 gün önce oyunda ve sitede duyururuz; bu sürede yeni Majold satışı durur ve elindeki Majold'u kullanabilirsin.\n\n10. Sorumluluk\nMahjoria olduğu gibi sunulur. Kesintisiz ve hatasız çalışması için makul çabayı gösteririz, ancak her cihazda her koşulda kusursuz çalışacağını garanti edemeyiz. Yürürlükteki hukukun izin verdiği ölçüde, bizim kusurumuz olmayan cihaz, bağlantı, mağaza ya da üçüncü taraf kaynaklı sorunlardan ve bunların doğurduğu dolaylı zararlardan sorumlu değiliz. Kasıt ve ağır ihmal hallerindeki sorumluluğumuz ile kanunla tanınan tüketici hakların hiçbir şekilde sınırlanmaz.\n\n11. Uygulanacak hukuk ve uyuşmazlıklar\nBu koşullara Türkiye Cumhuriyeti hukuku uygulanır. Tüketiciysen, yaşadığın ülkenin seni koruyan zorunlu kuralları da geçerlidir ve kendi ülkendeki tüketici hakem heyetine ya da mahkemesine başvurma hakkın saklıdır. Önce info@swiff.com.tr adresine yazmanı rica ederiz; sorunları çoğunlukla hızlıca çözebiliriz.\n\n12. Değişiklikler, bölünebilirlik, iletişim\nBu koşulları güncelleyebiliriz; güncel tarih bu sayfada yazılır, önemli değişiklikleri oyunda duyururuz. Bir maddenin geçersiz sayılması diğer maddeleri etkilemez. Sorular: info@swiff.com.tr", "rulesH": "Kurallar ve Adil Oyun", "rulesL": "Kurallar", "rulesT": "Bu sayfa Mahjoria'daki puanların, sıralamaların ve ödüllerin nasıl işlediğini anlatır. Oyundaki \"Kurallar ve Adil Oyun\" ekranı bu sayfanın özetidir; ikisi çelişirse bu sayfa geçerlidir. Son güncelleme: 17 Kasım 2026.\n\nNot: Haftalık sıralama, Ayın Birincisi ve ödüller henüz oyunda açılmadı. Açıldıklarında oyunda duyurulacak ve o tarihten itibaren bu kurallar geçerli olacak; o güne kadar bu maddeler hiçbir ödül vaadi içermez.\n\n1. Düzenleyen\nMahjoria'yı ve içindeki sıralama ve ödülleri Swiff Studio düzenler (iletişim: info@swiff.com.tr). Apple ve Google bu sıralamaların ve ödüllerin sponsoru değildir ve hiçbir şekilde bunlarla ilgili değildir.\n\n2. Katılım ücretsizdir\nSıralamalara katılmak için hiçbir şey satın almak gerekmez. Satın alma, reklam izleme ya da Majold harcama kazanma şansını artırmaz: puan yalnızca oynayarak kazanılır.\nSıralamaları bizim bir sunucumuz değil, iPhone ve iPad'de Apple Game Center, Android'de Google Play Games tutar. Katılmak için bu servise kendi Apple ya da Google hesabınla giriş yaparsın; sıralamada oradaki takma adın ve puanın görünür. Bu bilgileri Apple ve Google kendi gizlilik kurallarına göre işler; Swiff Studio senin hakkında hiçbir kişisel veri toplamaz ve saklamaz. Giriş yapmazsan oyunu aynen oynamaya devam edersin, yalnızca sıralamada görünmez ve sıralama ödülü almazsın.\n\n3. Puan nasıl hesaplanır\n• Bitirdiğin her parselde kaldırdığın her taş 10 puandır. Parselin yıldızı bunu çarpar: 1 yıldız ×0,9 · 2 yıldız ×1,0 · 3 yıldız ×1,1.\n• Hızlı eşleştirme zincirleri (combo) ek puan verir: 3. eşleştirmeden itibaren zincirdeki sıra ×10 puan; 6, 9 ve 12. eşleştirmede +100, +250, +500; 12'den sonra her 3 eşleştirmede +500.\n• Açılan alan (m²) puan değildir; yalnızca bilgi olarak gösterilir. Bu sayede az taşlı kolay parselleri arka arkaya açmak, çok taşlı zor parselleri açan oyuncunun önüne geçmez.\n• Satın alınan, reklamla ya da hediye olarak kazanılan ipucu, karıştırma ve Majold puan getirmez. Dünya Turu, Gizli Bölge ve etkinlik tahtaları Majold verir, sıralama puanı vermez.\n• Gizli çarpan, oyuncuya özel avantaj ya da ileri seviyede açılan ek puan yoktur. Herkes için kurallar aynıdır.\n\n4. Haftalık sıralama\n• Haftalık sıralamada yalnız o hafta kazanılan puan sayılır. Apple ve Google'ın sıralamaları birbirinden ayrıdır: iPhone/iPad oyuncuları kendi aralarında, Android oyuncuları kendi aralarında sıralanır.\n• Hafta, Apple Game Center'da pazartesi 00:00 UTC ile pazar 23:59 UTC arasıdır. Google Play Games'te haftayı Google belirler: cumartesiyi pazara bağlayan gece, ABD Pasifik saatiyle (UTC-7) sıfırlanır.\n• Puan eşitliğinde sıralamayı ilgili servis belirler.\n\n5. Ayın birincisi\nTakvim ayı boyunca (UTC) en yüksek toplam puanı alan oyuncu, her platformda ayrı ayrı \"Ayın Birincisi\" olur.\n\n6. Ödüller\n• Haftalık, her platformda: 1. 300 Majold + rozet · 2. 150 Majold · 3. 75 Majold. Ayrıca haftayı ilk %1'de bitiren herkese 50, ilk %10'da 25, ilk %25'te 10 Majold. Dilim ödülleri birikmez; en yüksek olanı verilir.\n• Ayın Birincisi: o aya özel taş teması + rozet.\n• Ödül, hafta ya da ay bittikten sonra oyunu ilk açtığında eklenir. Derecen Apple ya da Google'ın bildirdiği sonuca göre belirlenir. Google Play Games geçmiş haftanın sonucunu vermediği için Android'de derecen, haftanın son 24 saatinde oyunu açtığında okunan son derecedir; o gün oyunu açmadıysan o haftanın ödülü verilemez.\n• Ödüller yalnızca oyun içi dijital öğelerdir. Nakit değerleri yoktur; paraya çevrilemez, satılamaz, başkasına devredilemez, takas edilemez. Ödül yerine para ya da başka bir şey istenemez.\n• Ödül miktarları ve türleri bir haftadan ya da aydan önce duyurularak değiştirilebilir; başlamış bir hafta ya da ay için değiştirilmez.\n\n7. Majold\n• Majold, Mahjoria içinde ipucu ve karıştırma gibi öğeler için kullanılan sanal paradır. Oynayarak, günlük hediyeyle, ödüllü reklamla ya da satın alarak kazanılır.\n• Majold'un oyun dışında değeri yoktur; paraya çevrilemez, başka hesaba aktarılamaz.\n• Majold ile alınan her öğenin yaklaşık avro karşılığı oyunda fiyatın yanında gösterilir (100 Majold ≈ 0,99 €). Paketlerin içeriği sabittir; Mahjoria'da rastgele ödül kutusu, çark ya da şansa dayalı satın alma yoktur.\n• Satın almalar Apple App Store ya da Google Play üzerinden yapılır; ödeme, iade ve ebeveyn izni bu mağazaların kurallarına göre işler. Yasal cayma ve iade hakların saklıdır.\n• Kazandığın ya da satın aldığın Majold ve öğeler, hile ya da teknik hata (ör. yanlışlıkla iki kez verilen ödül) dışında senden geri alınmaz.\n\n8. Adil oyun\n• Hile yazılımı, otomatik oynatıcı, oyun dosyalarını ya da kayıtları değiştirmek, cihaz saatiyle oynamak, oyunun hatalarını bilerek kullanmak ve birden fazla hesapla ödül toplamak yasaktır.\n• Olağan dışı puanlar incelenir. Kural ihlali görülürse puanlar silinebilir, oyuncu sıralamalardan çıkarılabilir ve haksız kazanılan ödüller geri alınabilir.\n• Kararlara 14 gün içinde info@swiff.com.tr adresine yazarak itiraz edebilirsin; itirazlar en geç 30 gün içinde yanıtlanır.\n• Uygunsuz takma adlar değiştirilir.\n\n9. Çocuklar\nMahjoria herkese uygundur. Sıralamalarda yalnızca Apple ya da Google'daki takma adın görünür. 18 yaşından küçükler satın alma için ebeveyn izni almalıdır; Apple ve Google'ın ebeveyn denetimleri (satın alma onayı) kullanılabilir.\n\n10. Kesintiler ve sorumluluk\nMahjoria olduğu gibi sunulur. Bağlantı, sunucu, cihaz ya da mağaza kaynaklı kesintilerde sıralama ve ödüllerin doğru işlemesi için makul çabayı gösteririz. Yürürlükteki hukukun izin verdiği ölçüde, bizim kusurumuz olmayan bu tür kesintiler yüzünden oluşan puan ya da sıralama kayıplarından sorumlu değiliz. Bu madde, kanunla tanınan tüketici haklarını hiçbir şekilde kısıtlamaz.\n\n11. Değişiklikler ve iletişim\nBu kuralları güncelleyebiliriz; değişiklik tarihi bu sayfada yazılır ve başlamış bir hafta ya da ayı etkilemez. Sıralamalar oyunda açıldığı tarihten itibaren bu kurallara tabidir. Sorular ve itirazlar: info@swiff.com.tr"}, "de": {"lede": "Ein ganzer Planet liegt unter Mahjong-Steinen. Finde Paare, räume jede Parzelle und sieh zu, wie sich das Land darunter hebt.", "soon": "Demnächst", "tryH": "Räume hier eine Parzelle", "tryP": "Tippe zwei Steine mit gleichem Symbol an. Jedes Paar legt den Boden darunter frei. Im Spiel bringt jede fertige Parzelle 108 m² für deine Welt.", "m2": "m² freigelegt", "again": "Neue Steine legen", "done": "Parzelle geräumt. Unter den Steinen warten noch Millionen weitere.", "worldH": "Ein Planet aus drei Höhen", "worldP": "Zoome heraus: Die Parzelle, die du spielst, wird Teil einer Steinlandschaft, dann einer Kugel im All. Alles, was du öffnest, bleibt offen.", "l1h": "Die Kugel", "l1p": "Dein geöffnetes Land leuchtet grün auf einem Planeten, der noch mit Elfenbeinsteinen bedeckt ist.", "l2h": "Die Landschaft", "l2p": "Die Höhe der Stapel folgt dem Land darunter. So ahnst du, wo Hügel und Seen auftauchen.", "l3h": "Deine Parzelle", "l3p": "Große, klare Steine für den Handybildschirm. Ist eine fertig, hebt sich der Boden, manchmal mit einer Entdeckung.", "mjH": "Majold, die Münze des Planeten", "mjP": "Majold verdienst du mit geräumten Parzellen, Sternen und täglichen Besuchen. Gib es für Tipps und Mischen aus, wenn es knifflig wird.", "mjPromise": "Keine Werbung zwischen den Zügen. Werbung läuft nur, wenn du sie für Majold sehen willst.", "helloH": "In 21 Sprachen spielbar", "privL": "Datenschutz", "termsL": "Nutzungsbedingungen", "back": "Zurück zu Mahjoria", "privH": "Deine Privatsphäre", "termsH": "Nutzungsbedingungen", "privT": "Mahjoria hat keine Konten und keine Anmeldung.\n\n• Dein Fortschritt wird nur auf diesem Gerät gespeichert; wir haben keinen Server und erheben keine persönlichen Daten von dir.\n• Werbung läuft nur, wenn du es willst („Werbung ansehen“). Die Werbung stammt von Google AdMob; AdMob kann Angaben wie die Werbe-ID deines Geräts und den ungefähren Standort nutzen, um Werbung anzuzeigen und zu messen. In Europa wirst du beim Start um Einwilligung gebeten; deine Wahl kannst du in den Einstellungen unter „Werbe-Datenschutz“ ändern.\n• Wenn du die App löschst, werden alle Spieldaten gelöscht. Mit „Von vorn beginnen“ in den Einstellungen kannst du deinen Fortschritt jederzeit zurücksetzen.\n• So nutzt Google Daten: policies.google.com/technologies/partner-sites", "termsT": "Der vollständige Text ist derzeit auf Englisch und Türkisch verfügbar.\n\nThese terms govern your use of the Mahjoria game, the mahjoria.com website and related services. By downloading and playing the game you accept these terms, the Privacy notice and the \"Rules & fair play\" page. Last updated: 17 November 2026.\n\n1. Parties\nMahjoria is published by Swiff Studio (contact: info@swiff.com.tr). You download the app from the Apple App Store or Google Play; these stores are not parties to these terms and are not responsible for supporting the game.\n\n2. Licence to play\nWe give you a personal, non-transferable, non-exclusive and revocable licence to use Mahjoria for personal, non-commercial entertainment. You may not copy, modify, sell or reuse in another product the game's code, artwork, sounds, the Mahjoria name or logo. All rights in them belong to Swiff Studio.\n\n3. For entertainment only\nMahjoria is a skill and puzzle game. It contains no real-money gambling, betting or games of chance, and no real money or real-world prizes can be won. All rewards in the game are in-game digital items.\n\n4. Majold and in-game items\n• Majold, hints, shuffles and similar items are licensed to you for use in the game; they are not your property and have no value outside the game. They cannot be exchanged for money, sold or transferred to another person or device.\n• The approximate euro value of every item priced in Majold is shown next to the price. Pack contents are fixed; the game has no random reward boxes or purchases based on chance.\n• Purchases are made through Apple or Google; there are no subscriptions. Refund requests are handled under the store's rules. Your statutory withdrawal and refund rights are not affected.\n• We do not take back Majold or items you earned or bought, except in cases of cheating or a technical error (e.g. a reward given by mistake).\n\n5. How your progress is stored\nMahjoria has no accounts; your progress, Majold and purchased items are stored only on your device. If you delete the app, reset or lose your device, this data is lost and we have no way to restore it. One-time packs you bought can be restored to the extent the store offers \"restore purchases\".\n\n6. Fair play\nCheat software, auto-players, modifying game files or saves, manipulating the device clock, knowingly exploiting bugs and using the game to harm others are not allowed. In such cases scores and unfairly gained items may be removed and access to leaderboards may be blocked. Details are on the \"Rules & fair play\" page.\n\n7. Ads\nThe game only shows rewarded ads that you choose to open (\"Watch ad\"); there are no forced ads between play. Ads are served by Google AdMob; advertisers are responsible for ad content.\n\n8. Children and parents\nMahjoria is suitable for everyone. Players under 18 should ask a parent before making purchases. Parents can use Apple's and Google's controls such as purchase approval and spending limits. For a purchase made by a child without permission, you can use the store's refund process.\n\n9. Changes to the game and end of service\nWe may update content, prices, rewards and rules to improve the game. We will not use such changes to make items you already bought worthless. If we decide to shut Mahjoria down completely, we will announce it in the game and on the website at least 60 days in advance; during that time new Majold sales stop and you can use the Majold you have.\n\n10. Liability\nMahjoria is provided as is. We make reasonable efforts for it to work without interruption or errors, but we cannot guarantee it will work perfectly on every device in every situation. To the extent permitted by applicable law, we are not responsible for problems caused by devices, connections, stores or third parties that are not our fault, or for indirect damage resulting from them. Our liability for intent and gross negligence, and your statutory consumer rights, are not limited in any way.\n\n11. Governing law and disputes\nThese terms are governed by the laws of the Republic of Türkiye. If you are a consumer, the mandatory protections of your country of residence also apply and you keep the right to go to the consumer bodies or courts of your own country. We kindly ask you to write to info@swiff.com.tr first; most issues can be solved quickly.\n\n12. Changes, severability, contact\nWe may update these terms; the current date is shown on this page and important changes are announced in the game. If one section is found invalid, the others remain in force. Questions: info@swiff.com.tr", "rulesH": "Regeln & Fair Play", "rulesL": "Regeln", "rulesT": "Der vollständige Text ist derzeit auf Englisch und Türkisch verfügbar.\n\nThis page explains how scores, leaderboards and prizes work in Mahjoria. The \"Rules & fair play\" screen in the game is a summary of this page; if they differ, this page applies. Last updated: 17 November 2026.\n\nNote: the weekly leaderboard, Player of the month and prizes are not live in the game yet. They will be announced in the game when they open, and these rules apply from that date; until then these sections are not a promise of any prize.\n\n1. Organiser\nMahjoria and its leaderboards and prizes are run by Swiff Studio (contact: info@swiff.com.tr). Apple and Google are not sponsors of these leaderboards or prizes and are not involved with them in any way.\n\n2. Taking part is free\nNo purchase is needed to take part. Buying anything, watching ads or spending Majold does not improve your chances: points are earned only by playing.\nLeaderboards are not run on a server of ours but by Apple Game Center on iPhone and iPad and by Google Play Games on Android. To take part you sign in to that service with your own Apple or Google account; the leaderboard shows your nickname there and your score. Apple and Google process this under their own privacy policies; Swiff Studio does not collect or store any personal data about you. If you do not sign in, you play exactly the same, you just do not appear on leaderboards and receive no leaderboard prizes.\n\n3. How points are calculated\n• Every tile you remove in a parcel you finish is worth 10 points. The parcel's stars multiply this: 1 star ×0.9 · 2 stars ×1.0 · 3 stars ×1.1.\n• Quick matching chains (combos) give bonus points: from the 3rd match on, the position in the chain ×10 points; +100, +250 and +500 at the 6th, 9th and 12th match; after the 12th, +500 every 3 matches.\n• Land opened (m²) is not a score; it is shown for information only. Clearing many easy parcels with few tiles therefore does not put a player ahead of someone clearing hard parcels with many tiles.\n• Hints, shuffles and Majold that are bought, earned from ads or received as gifts give no points. World Tour, Hidden Area and event boards give Majold, not leaderboard points.\n• There are no hidden multipliers, no player-specific advantages and no extra points unlocked at higher levels. The rules are the same for everyone.\n\n4. Weekly leaderboard\n• Only points earned that week count on the weekly leaderboard. Apple's and Google's leaderboards are separate: iPhone/iPad players are ranked among themselves and Android players among themselves.\n• On Apple Game Center the week runs from Monday 00:00 UTC to Sunday 23:59 UTC. On Google Play Games the week is set by Google: it resets at midnight between Saturday and Sunday, US Pacific time (UTC-7).\n• On equal points, the ranking is decided by the respective service.\n\n5. Player of the month\nThe player with the highest total score over the calendar month (UTC) becomes \"Player of the month\", separately on each platform.\n\n6. Prizes\n• Weekly, on each platform: 1st 300 Majold + badge · 2nd 150 Majold · 3rd 75 Majold. In addition everyone finishing the week in the top 1% gets 50, top 10% 25 and top 25% 10 Majold. Tier prizes do not stack; the highest applies.\n• Player of the month: a tile theme made for that month + badge.\n• The prize is added the first time you open the game after the week or month ends. Your position is the result reported by Apple or Google. Because Google Play Games does not provide past weeks' results, on Android your position is the last one read when you open the game during the final 24 hours of the week; if you did not open the game that day, no prize can be given for that week.\n• Prizes are in-game digital items only. They have no cash value and cannot be exchanged for money, sold, transferred or traded. No cash or other alternative can be requested instead.\n• Prize amounts and types may change if announced before a week or month starts; they never change for a week or month already under way.\n\n7. Majold\n• Majold is the virtual currency used in Mahjoria for items such as hints and shuffles. It is earned by playing, from the daily gift, from rewarded ads, or by purchase.\n• Majold has no value outside Mahjoria and cannot be exchanged for money or moved to another account.\n• The approximate euro value of every item priced in Majold is shown next to the price in the game (100 Majold ≈ €0.99). Pack contents are fixed; Mahjoria has no random reward boxes, wheels or purchases based on chance.\n• Purchases are made through the Apple App Store or Google Play; payment, refunds and parental approval follow those stores' rules. Your statutory withdrawal and refund rights are not affected.\n• Majold and items you earned or bought are never taken back, except in cases of cheating or a technical error (e.g. a prize given twice by mistake).\n\n8. Fair play\n• Cheat software, auto-players, modifying game files or saves, manipulating the device clock, knowingly exploiting bugs and collecting prizes with several accounts are not allowed.\n• Unusual scores are reviewed. If the rules were broken, scores may be removed, the player may be excluded from leaderboards and prizes gained unfairly may be taken back.\n• You can appeal a decision within 14 days by writing to info@swiff.com.tr; appeals are answered within 30 days at the latest.\n• Inappropriate nicknames are changed.\n\n9. Children\nMahjoria is suitable for everyone. Leaderboards only show your Apple or Google nickname. Players under 18 need a parent's permission to make purchases; Apple's and Google's parental controls (purchase approval) can be used.\n\n10. Interruptions and liability\nMahjoria is provided as is. We make reasonable efforts to keep leaderboards and prizes working correctly during connection, server, device or store interruptions. To the extent permitted by applicable law, we are not responsible for points or rankings lost because of such interruptions that are not our fault. This section does not limit any consumer rights you have by law.\n\n11. Changes and contact\nWe may update these rules; the date of the change is shown on this page and changes never affect a week or month already under way. Leaderboards are subject to these rules from the date they open in the game. Questions and appeals: info@swiff.com.tr"}, "fr": {"lede": "Une planète entière dort sous les tuiles de mahjong. Associez les paires, nettoyez chaque parcelle et regardez la terre s'élever dessous.", "soon": "Bientôt disponible", "tryH": "Dégagez une parcelle ici", "tryP": "Touchez deux tuiles au même symbole. Chaque paire ouvre le sol en dessous. Dans le jeu, chaque parcelle terminée ajoute 108 m² à votre monde.", "m2": "m² dégagés", "again": "Poser de nouvelles tuiles", "done": "Parcelle dégagée. Des millions d'autres attendent sous les tuiles.", "worldH": "Une planète vue de trois hauteurs", "worldP": "Dézoomez : la parcelle jouée devient un morceau de paysage en tuiles, puis un globe dans l'espace. Tout ce que vous ouvrez reste ouvert.", "l1h": "Le globe", "l1p": "Vos terres ouvertes apparaissent en vert sur une planète encore couverte de tuiles d'ivoire.", "l2h": "Le paysage", "l2p": "La hauteur des piles suit le relief dessous : devinez où surgiront collines et la o forced ads between play. Ads are served by Google AdMob; advertisers are responsible for ad content.\n\n8. Children and parents\nMahjoria is suitable for everyone. Players under 18 should ask a parent before making purchases. Parents can use Apple's and Google's controls such as purchase approval and spending limits. For a purchase made by a child without permission, you can use the store's refund process.\n\n9. Changes to the game and end of service\nWe may update content, prices, rewards and rules to improve the game. We will not use such changes to make items you already bought worthless. If we decide to shut Mahjoria down completely, we will announce it in the game and on the website at least 60 days in advance; during that time new Majold sales stop and you can use the Majold you have.\n\n10. Liability\nMahjoria is provided as is. We make reasonable efforts for it to work without interruption or errors, but we cannot guarantee it will work perfectly on every device in every situation. To the extent permitted by applicable law, we are not responsible for problems caused by devices, connections, stores or third parties that are not our fault, or for indirect damage resulting from them. Our liability for intent and gross negligence, and your statutory consumer rights, are not limited in any way.\n\n11. Governing law and disputes\nThese terms are governed by the laws of the Republic of Türkiye. If you are a consumer, the mandatory protections of your country of residence also apply and you keep the right to go to the consumer bodies or courts of your own country. We kindly ask you to write to info@swiff.com.tr first; most issues can be solved quickly.\n\n12. Changes, severability, contact\nWe may update these terms; the current date is shown on this page and important changes are announced in the game. If one section is found invalid, the others remain in force. Questions: info@swiff.com.tr", "rulesH": "Regras e jogo limpo", "rulesL": "Regras", "rulesT": "O texto  many tiles.\n• Hints, shuffles and Majold that are bought, earned from ads or received as gifts give no points. World Tour, Hidden Area and event boards give Majold, not leaderboard points.\n• There are no hidden multipliers, no player-specific advantages and no extra points unlocked at higher levels. The rules are the same for everyone.\n\n4. Weekly leaderboard\n• Only points earned that week count on the weekly leaderboard. Apple's and Google's leaderboards are separate: iPhone/iPad players are ranked among themselves and Android players among themselves.\n• On Apple Game Center the week runs from Monday 00:00 UTC to Sunday 23:59 UTC. On Google Play Games the week is set by Google: it resets at midnight between Saturday and Sunday, US Pacific time (UTC-7).\n• On equal points, the ranking is decided by the respective service.\n\n5. Player of the month\nThe player with the highest total score over the calendar month (UTC) becomes \"Player of the month\", separately on each platform.\n\n6. Prizes\n• Weekly, on each platform: 1st 300 Majold + badge · 2nd 150 Majold · 3rd 75 Majold. In addition everyone finishing the week in the top 1% gets 50, top 10% 25 and top 25% 10 Majold. Tier prizes do not stack; the highest applies.\n• Player of the month: a tile theme made for that month + badge.\n• The prize is added the first time you open the game after the week or month ends. Your position is the result reported by Apple or Google. Because Google Play Games does not provide past weeks' results, on Android your position is the last one read when you open the game during the final 24 hours of the week; if you did not open the game that day, no prize can be given for that week.\n• Prizes are in-game digital items only. They have no cash value and cannot be exchanged for money, sold, transferred or traded. No cash or other alternative can be requested instead.\n• Prize amounts and types may change if announced before a week or month starts; they never change for a week or month already under way.\n\n7. Majold\n• Majold is the virtual currency used in Mahjoria for items such as hints and shuffles. It is earned by playing, from the daily gift, from rewarded ads, or by purchase.\n• Majold has no value outside Mahjoria and cannot be exchanged for money or moved to another account.\n• The approximate euro value of every item priced in Majold is shown next to the price in the game (100 Majold ≈ €0.99). Pack contents are fixed; Mahjoria has no random reward boxes, wheels or purchases based on chance.\n• Purchases are made through the Apple App Store or Google Play; payment, refunds and parental approval follow those stores' rules. Your statutory withdrawal and refund rights are not affected.\n• Majold and items you earned or bought are never taken back, except in cases of cheating or a technical error (e.g. a prize given twice by mistake).\n\n8. Fair play\n• Cheat software, auto-players, modifying game files or saves, manipulating the device clock, knowingly exploiting bugs and collecting prizes with several accounts are not allowed.\n• Unusual scores are reviewed. If the rules were broken, scores may be removed, the player may be excluded from leaderboards and prizes gained unfairly may be taken back.\n• You can appeal a decision within 14 days by writing to info@swiff.com.tr; appeals are answered within 30 days at the latest.\n• Inappropriate nicknames are changed.\n\n9. Children\nMahjoria is suitable for everyone. Leaderboards only show your Apple or Google nickname. Players under 18 need a parent's permission to make purchases; Apple's and Google's parental controls (purchase approval) can be used.\n\n10. Interruptions and liability\nMahjoria is provided as is. We make reasonable efforts to keep leaderboards and prizes working correctly during connection, server, device or store interruptions. To the extent permitted by applicable law, we are not responsible for points or rankings lost because of such interruptions that are not our fault. ek; if you did not open the game that day, no prize can be given for that week.\n• Prizes are in-game digital items only. They have no cash value and cannot be exchanged for money, sold, transferred or traded. No cash or other alternative can be requested instead.\n• Prize amounts and types may change if announced before a week or month starts; they never change for a week or month already under way.\n\n7. Majold\n• Majold is the virtual currency used in Mahjoria for items such as hints and shuffles. It is earned by playing, from the daily gift, from rewarded ads, or by purchase.\n• Majold has no value outside Mahjoria and cannot be exchanged for money or moved to another account.\n• The approximate euro value of every item priced in Majold is shown next to the price in the game (100 Majold ≈ €0.99). Pack contents are fixed; Mahjoria has no random reward boxes, wheels or purchases based on chance.\n• Purchases are made through the Apple App Store or Google Play; payment, refunds and parental approval follow those stores' rules. Your statutory withdrawal and refund rights are not affected.\n• Majold and items you earned or bought are never taken back, except in cases of cheating or a technical error (e.g. a prize given twice by mistake).\n\n8. Fair play\n• Cheat software, auto-players, modifying game files or saves, manipulating the device clock, knowingly exploiting bugs and collecting prizes with several accounts are not allowed.\n• Unusual scores are reviewed. If the rules were broken, scores may be removed, the player may be excluded from leaderboards and prizes gained unfairly may be taken back.\n• You can appeal a decision within 14 days by writing to info@swiff.com.tr; appeals are answered within 30 days at the latest.\n• Inappropriate nicknames are changed.\n\n9. Children\nMahjoria is suitable for everyone. Leaderboards only show your Apple or Google nickname. Players under 18 need a parent's permission to make purchases; Apple's and Google's parental controls (purchase approval) can be used.\n\n10. Interruptions and liability\nMahjoria is provided as is. We make reasonable efforts to keep leaderboards and prizes working correctly during connection, server, device or store interruptions. To the extent permitted by applicable law, we are not responsible for points or rankings lost because of such interruptions that are not our fault. This section does not limit any consumer rights you have by law.\n\n11. Changes and contact\nWe may update these rules; the date of the change is shown on this page and changes never affect a week or month already under way. Leaderboards are subject to these rules from the date they open in the game. Questions and appeals: info@swiff.com.tr"}, "zh_CN": {"lede": "整颗星球都藏在麻将牌下。配对、清理每一块地，看着土地从下面升起。", "soon": "即将推出", "tryH": "在这里清理一块地", "tryP": "点击两张图案相同的牌。每配对一次，下面的土地就会露出来。在游戏中，每完成一块地，你的世界就扩大 108 m²。", "m2": "m² 已开拓", "again": "重新摆牌", "done": "地块已清理。牌下还有数百万块地在等着你。", "worldH": "一颗星球，三种高度", "worldP": "缩小视角：你正在玩的地块会变成一片牌面风景，再变成太空中的一颗星球。你开拓的地方会一直保留。", "l1h": "星球", "l1p": "在仍被象牙色麻将牌覆盖的星球上，你开拓的土地显示为绿色。", "l2h": "风景", "l2p": "牌堆的高度跟随下方的地形，你可以猜出哪里会出现山丘和湖泊。", "l3h": "你的地块", "l3p": "为手机屏幕设计的大而清晰的牌。完成后地面会升起，有时还有新发现。", "mjH": "Majold，星球的货币", "mjP": "清理地块、收集星星、每天回来都能获得 Majold。地块变难时，用它换取提示和洗牌。", "mjPromise": "回合之间没有广告。只有当你选择看广告换取 Majold 时才会播放。", "helloH": "支持 21 种语言", "privL": "隐私", "termsL": "使用条款", "back": "返回 Mahjoria", "privH": "你的隐私", "termsH": "使用条款", "privT": "Mahjoria 没有账号，也无需注册。\n\n• 你的进度只保存在本设备上；我们没有服务器，也不收集你的任何个人数据。\n• 只有在你主动选择时才会播放广告（“看广告”）。广告由 Google AdMob 提供，AdMob 可能会使用设备的广告标识符和大致位置等信息来展示和衡量广告。在欧洲，启动时会征求你的同意；你可以在“设置”的“广告隐私”中更改选择。\n• 删除应用会同时删除所有游戏数据。你可以随时在“设置”中通过“从头开始”重置进度。\n• Google 如何使用数据：policies.google.com/technologies/partner-sites", "termsT": "完整文本目前提供英文和土耳其文版本。\n\nThese terms govern your use of the Mahjoria game, the mahjoria.com website and related services. By downloading and playing the game you accept these terms, the Privacy notice and the \"Rules & fair play\" page. Last updated: 17 N oria and its leaderboards and prizes are run by Swiff Studio (contact: info@swiff.com.tr). Apple and Google are not sponsors of these leaderboards or prizes and are not involved with them in any way.\n\n2. Taking part is free\nNo purchase is needed to take part. Buying anything, watching ads or spending Majold does not improve your chances: points are earned only by playing.\nLeaderboards are not run on a server of ours but by Apple Game Center on iPhone and iPad and by Google Play Games on Android. To take part you sign in to that service with your own Apple or Google account; the leaderboard shows your nickname there and your score. Apple and Google process this under their own privacy policies; Swiff Studio does not collect or store any personal data about you. If you do not sign in, you play exactly the same, you just do not appear on leaderboards and receive no leaderboard prizes.\n\n3. How points are calculated\n• Every tile you remove in a parcel you finish is worth 10 points. The parcel's stars multiply this: 1 star ×0.9 · 2 stars ×1.0 · 3 stars ×1.1.\n• Quick matching chains (combos) give bonus points: from the 3rd match on, the position in the chain ×10 points; +100, +250 and +500 at the 6th, 9th and 12th match; after the 12th, +500 every 3 matches.\n• Land opened (m²) is not a score; it is shown for information only. Clearing many easy parcels with few tiles therefore does not put a player ahead of someone clearing hard parcels with many tiles.\n• Hints, shuffles and Majold that are bought, earned from ads or received as gifts give no points. World Tour, Hidden Area and event boards give Majold, not leaderboard points.\n• There are no hidden multipliers, no player-specific advantages and no extra points unlocked at higher levels. The rules are the same for everyone.\n\n4. Weekly leaderboard\n• Only points earned that week count on the weekly leaderboard. Apple's and Google's leaderboards are separate: iPhone/iPad players are ranked among themselves and Android players among themselves.\n• On Apple Game Center the week runs from Monday 00:00 UTC to Sunday 23:59 UTC. On Google Play Games the week is set by Google: it resets at midnight between Saturday and Sunday, US Pacific time (UTC-7).\n• On equal points, the ranking is decided by the respective service.\n\n5. Player of the month\nThe player with the highest total score over the calendar month (UTC) becomes \"Player of the month\", separately on each platform.\n\n6. Prizes\n• Weekly, on each platform: 1st 300 Majold + badge · 2nd 150 Majold · 3rd 75 Majold. In addition everyone finishing the week in the top 1% gets 50, top 10% 25 and top 25% 10 Majold. Tier prizes do not stack; the highest applies.\n• Player of the month: a tile theme made for that month + badge.\n• The prize is added the first time you open the game after the week or month ends. Your position is the result reported by Apple or Google. Because Google Play Games does not provide past weeks' results, on Android your position is the last one read when you open the game during the final 24 hours of the week; if you did not open the game that day, no prize can be given for that week.\n• Prizes are in-game digital items only. They have no cash value and cannot be exchanged for money, sold, transferred or traded. No cash or other alternative can be requested instead.\n• Prize amounts and types may change if announced before a week or month starts; they never change for a week or month already under way.\n\n7. Majold\n• Majold is the virtual currency used in Mahjoria for items such as hints and shuffles. It is earned by playing, from the daily gift, from rewarded ads, or by purchase.\n• Majold has no value outside Mahjoria and cannot be exchanged for money or moved to another account.\n• The approximate euro value of every item priced in Majold is shown next to the price in the game (100 Majold ≈ €0.99). Pack contents are fixed; Mahjoria has no random reward boxes, wheels or purchases based on chance.\n• P const GP = ["ar", "de", "en", "es", "fr", "hi", "id", "it", "ja", "ko", "nl", "pl", "pt_BR", "ru", "th", "tr", "uk", "vi", "zh_CN"];
const NAMES = {"en": "English", "tr": "Türkçe", "de": "Deutsch", "fr": "Français", "es": "Español", "it": "Italiano", "pt_BR": "Português (Brasil)", "ru": "Русский", "uk": "Українська", "pl": "Polski", "nl": "Nederlands", "sv": "Svenska", "ja": "日本語", "ko": "한국어", "zh_CN": "简体中文", "zh_TW": "繁體中文", "ar": "العربية", "hi": "हिन्दी", "id": "Bahasa Indonesia", "th": "ไทย", "vi": "Tiếng Việt"};
function pickLang() {
  try { const q = new URLSearchParams(location.search).get("lang"); if (q && T[q]) return q; } catch (e) {}
  try { const s = localStorage.getItem("mj-lang"); if (s && T[s]) return s; } catch (e) {}
  for (const n of (navigator.languages || [navigator.language || "en"])) {
    const l = n.replace("-", "_");
    if (T[l]) return l;
    if (l.startsWith("zh")) return /TW|HK|Hant/i.test(l) ? "zh_TW" : "zh_CN";
    if (l.startsWith("pt")) return "pt_BR";
    const b = l.split("_")[0]; if (T[b]) return b;
  }
  return "en";
}
let lang = pickLang();
const sel = document.getElementById("lang");
function rich(t) {
  // kurallar metni: "1. Başlık" satırları başlık, "• " satırları madde listesi, diğerleri paragraf
  const esc = x => x.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let h = "", ul = false;
  for (const raw of t.split("\n")) {
    const l = raw.trim();
    if (!l) { if (ul) { h += "</ul>"; ul = false; } continue; }
    if (l.startsWith("• ")) { if (!ul) { h += "<ul>"; ul = true; } h += "<li>" + esc(l.slice(2)) + "</li>"; continue; }
    if (ul) { h += "</ul>"; ul = false; }
    if (/^\d+\. /.test(l)) h += "<h2>" + esc(l) + "</h2>";
    else h += "<p>" + esc(l) + "</p>";
  }
  return h + (ul ? "</ul>" : "");
}
function setLang(l) {
  lang = T[l] ? l : "en";
  const tt = Object.assign({}, T.en, T[lang]);
  document.documentElement.lang = lang.replace("_", "-");
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(el => { const v = tt[el.dataset.i]; if (v) { if ("rich" in el.dataset) el.innerHTML = rich(v); else el.textContent = v; } });
  sel.value = lang;
  const gp = document.querySelector(".gp"); if (gp) gp.src = "a/gp-" + (GP.includes(lang) ? lang : "en") + ".svg";
  document.querySelectorAll("a[data-keep]").forEach(a => a.href = a.dataset.keep + "?lang=" + lang);
  try { localStorage.setItem("mj-lang", lang); } catch (e) {}
}
sel.addEventListener("change", () => setLang(sel.value));
setLang(lang);

</script>
